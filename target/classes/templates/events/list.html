<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Events — Demetra</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="icon" th:href="@{/images/favicon.svg}">
</head>
<body>
<div th:replace="~{fragments/nav :: nav}"></div>

<div class="page-container">
    <div class="page-header">
        <div class="breadcrumbs">Demetra / Events</div>
        <h1>Musical Events</h1>
    </div>

    <section lang="bg" aria-labelledby="event-search-heading">
        <h2 id="event-search-heading">Търсене на събития</h2>
        <p>Изберете кога започва събитието. Сортирайте резултатите по датата и часа на създаване.</p>
        <form method="get" th:action="@{/events}" class="card filter-grid">
            <div class="form-group"><label for="week">Седмица по ISO</label><input id="week" type="week" name="week" th:value="${week}"></div>
            <div class="form-group"><label for="date">Точна дата</label><input id="date" type="date" name="date" th:value="${date}"></div>
            <div class="form-group"><label for="day">Ден от седмицата</label><select id="day" name="day"><option value="">Всички дни</option><option th:each="d : ${#numbers.sequence(1,7)}" th:value="${d}" th:selected="${day == d}" th:text="${({'Понеделник','Вторник','Сряда','Четвъртък','Петък','Събота','Неделя'})[d - 1]}"></option></select></div>
            <div class="form-group"><label for="hour">Начален час на събитието</label><select id="hour" name="hour"><option value="">Всички часове</option><option th:each="h : ${#numbers.sequence(0,23)}" th:value="${h}" th:selected="${hour == h}" th:text="${#numbers.formatInteger(h,2) + ':00 – ' + #numbers.formatInteger(h,2) + ':59'}"></option></select></div>
            <div class="form-group"><label for="sort">Сортиране по дата и час на създаване</label><select id="sort" name="sort"><option value="desc" th:selected="${sort == 'desc'}">Най-скоро създадените първо</option><option value="asc" th:selected="${sort == 'asc'}">Най-рано създадените първо</option></select></div>
            <div class="filter-actions"><button type="submit" class="btn">Филтрирай</button><a th:href="@{/events}" class="btn btn-secondary">Изчисти</a></div>
        </form>
        <h2 th:text="${'Намерени събития: ' + #lists.size(events)}"></h2>
        <p th:if="${#lists.isEmpty(events)}" class="no-events">Няма събития за избраните филтри.</p>
    </section>

    <div class="events-grid" th:unless="${#lists.isEmpty(events)}">
        <article class="event-card" th:each="event : ${events}">
            <div class="event-card-image">
                <span th:text="${event.category ?: 'Event'}">Category</span>
                <span th:text="${#temporals.format(event.startsAt, 'dd.MM.yyyy HH:mm')}" th:if="${event.startsAt}">Date</span>
                <span th:unless="${event.startsAt}">Date TBA</span>
            </div>
            <div class="event-card-body">
                <h3 th:text="${event.title}">Title</h3>
                <div class="event-meta" th:text="${'Създадено: ' + #temporals.format(event.createdAt, 'dd.MM.yyyy HH:mm')}"></div>
                <div class="event-meta" th:text="${event.location ?: 'Location TBA'}">Location</div>
                <div class="event-card-footer">
                    <span class="badge"
                          th:classappend="${confirmedCounts.get(event.id) >= event.capacity} ? 'badge-full' : 'badge-open'"
                          th:text="${confirmedCounts.get(event.id) >= event.capacity} ? 'Full' : 'Open'">Open</span>
                    <span th:text="${event.price > 0} ? '$' + ${#numbers.formatDecimal(event.price, 1, 2)} : 'Free'">Free</span>
                </div>
                <div class="event-meta" th:text="${confirmedCounts.get(event.id)} + ' / ' + ${event.capacity} + ' registered'">0 / 0</div>
                <span class="badge badge-registered" th:if="${myStatuses != null and myStatuses.get(event.id) == 'CONFIRMED'}">You're registered</span>
                <span class="badge badge-waitlisted" th:if="${myStatuses != null and myStatuses.get(event.id) == 'WAITLISTED'}">Waitlisted</span>
                <a th:href="@{'/events/' + ${event.id}}" class="btn" style="text-align:center;">View event</a>
            </div>
        </article>
    </div>
</div>
</body>
</html>
