<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Host an event — Demetra</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="icon" th:href="@{/images/favicon.svg}">
</head>
<body>
<div th:replace="~{fragments/nav :: nav}"></div>

<div class="page-container" style="max-width: 640px;">
    <div class="page-header">
        <div class="breadcrumbs">Demetra / Events / New</div>
        <h1>Host an event</h1>
    </div>

    <div class="card">
        <div class="alert alert-error" th:if="${error}" th:text="${error}"></div>

        <form method="post" th:action="@{/events/new}" th:object="${eventForm}">
            <div class="form-group">
                <label for="title">Title</label>
                <input id="title" th:field="*{title}" type="text" required placeholder="Spring Recital">
            </div>
            <div class="form-group">
                <label for="description">Description</label>
                <textarea id="description" th:field="*{description}" rows="4" placeholder="What should attendees expect?"></textarea>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label for="category">Category</label>
                    <input id="category" th:field="*{category}" type="text" placeholder="Recital">
                </div>
                <div class="form-group">
                    <label for="location">Location</label>
                    <input id="location" th:field="*{location}" type="text" placeholder="Concert Hall A">
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label for="capacity">Capacity</label>
                    <input id="capacity" th:field="*{capacity}" type="number" min="1" max="100000" required>
                </div>
                <div class="form-group">
                    <label for="price">Price ($)</label>
                    <input id="price" th:field="*{price}" type="number" min="0" max="100000" step="0.01">
                </div>
            </div>
            <div class="form-group">
                <label for="startsAt">Starts at</label>
                <input id="startsAt" th:field="*{startsAt}" type="datetime-local">
            </div>
            <button type="submit" class="btn">Publish event</button>
        </form>
    </div>
</div>
</body>
</html>
