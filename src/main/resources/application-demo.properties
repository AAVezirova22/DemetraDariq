# Isolated local demonstration; no connection to the existing MySQL/Demetra data.
server.port=8093
spring.application.name=DemetraDariqReportsDemo
spring.datasource.url=jdbc:h2:mem:dariq_reports_demo;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
