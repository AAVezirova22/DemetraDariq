spring.application.name=Demetra

# Stability AI autoconfiguration requires an API key even when the feature is unused;
# excluded because this slice of the app (auth + events) does not use it.
spring.autoconfigure.exclude=org.springframework.ai.model.stabilityai.autoconfigure.StabilityAiImageAutoConfiguration

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/demetra?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:demetra}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:demetra_password}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

spring.session.store-type=jdbc
spring.session.jdbc.initialize-schema=always

spring.thymeleaf.cache=false

server.port=8080

# Photos and initial administrator (created only when no admin exists).
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
demetra.admin.email=${DEMETRA_ADMIN_EMAIL:admin@demetra.local}
demetra.admin.password=${DEMETRA_ADMIN_PASSWORD:}
